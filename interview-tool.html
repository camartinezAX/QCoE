<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Assessment Tool - QCoE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --axos-orange: #FAA74A;
            --axos-orange-light: #fdd9a8;
            --axos-orange-dark: #e8922a;
            --axos-navy: #1E3860;
            --axos-navy-dark: #152844;
            --axos-navy-light: #2a4a7a;
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --bg-card: #161d2e;
            --border-color: #2d3748;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(30, 56, 96, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(30, 56, 96, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(250, 167, 74, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(250, 167, 74, 0.15);
            border: 1px solid rgba(250, 167, 74, 0.3);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            color: var(--axos-orange);
            margin-bottom: 16px;
        }
        
        .header h1 {
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--axos-orange) 0%, #fdd9a8 50%, var(--axos-orange) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        
        /* Candidate Tabs */
        .candidates-container {
            margin-bottom: 30px;
        }
        
        .tabs-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .candidate-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }
        
        .candidate-tab:hover {
            border-color: var(--axos-orange);
            color: var(--text-primary);
        }
        
        .candidate-tab.active {
            background: linear-gradient(135deg, var(--axos-navy) 0%, var(--axos-navy-dark) 100%);
            border-color: var(--axos-orange);
            color: var(--text-primary);
        }
        
        .candidate-tab .remove-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: rgba(239, 68, 68, 0.2);
            border: none;
            border-radius: 50%;
            color: var(--error);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .candidate-tab .remove-btn:hover {
            background: var(--error);
            color: white;
        }
        
        .add-candidate-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--axos-orange) 0%, var(--axos-orange-dark) 100%);
            border: none;
            border-radius: 12px;
            color: var(--bg-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .add-candidate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(250, 167, 74, 0.3);
        }
        
        /* Candidate Info Card */
        .candidate-info {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(30, 56, 96, 0.2) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--axos-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input, .form-group select {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--axos-orange);
            box-shadow: 0 0 0 3px rgba(250, 167, 74, 0.1);
        }
        
        /* Section Navigation */
        .section-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        
        .section-nav-btn {
            padding: 10px 16px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .section-nav-btn:hover {
            border-color: var(--axos-orange);
            color: var(--text-primary);
        }
        
        .section-nav-btn.active {
            background: var(--axos-orange);
            border-color: var(--axos-orange);
            color: var(--bg-primary);
        }
        
        /* Interview Sections */
        .section {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(30, 56, 96, 0.15) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: rgba(30, 56, 96, 0.3);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .section-header:hover {
            background: rgba(30, 56, 96, 0.4);
        }
        
        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .section-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--axos-orange) 0%, var(--axos-orange-dark) 100%);
            border-radius: 10px;
            font-size: 18px;
        }
        
        .section-title h2 {
            font-size: 18px;
            font-weight: 700;
        }
        
        .section-title p {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .section-toggle {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: 8px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        
        .section.collapsed .section-toggle {
            transform: rotate(-90deg);
        }
        
        .section-content {
            padding: 24px;
            display: block;
        }
        
        .section.collapsed .section-content {
            display: none;
        }
        
        /* Question Card */
        .question-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s ease;
        }
        
        .question-card:hover {
            border-color: rgba(250, 167, 74, 0.3);
        }
        
        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .question-checkbox {
            width: 24px;
            height: 24px;
            min-width: 24px;
            accent-color: var(--axos-orange);
            cursor: pointer;
            margin-top: 2px;
        }
        
        .question-text {
            flex: 1;
        }
        
        .question-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--axos-orange);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .question-label.optional {
            color: var(--info);
        }
        
        .question-text p {
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.5;
        }
        
        .answer-area {
            margin-top: 12px;
        }
        
        .answer-area textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s ease;
        }
        
        .answer-area textarea:focus {
            outline: none;
            border-color: var(--axos-orange);
            box-shadow: 0 0 0 3px rgba(250, 167, 74, 0.1);
        }
        
        .answer-area textarea::placeholder {
            color: var(--text-muted);
        }
        
        /* Example Answers Collapsible */
        .example-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: var(--info);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            transition: all 0.2s ease;
        }
        
        .example-toggle:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .example-toggle .arrow {
            transition: transform 0.2s ease;
        }
        
        .example-toggle.open .arrow {
            transform: rotate(90deg);
        }
        
        .example-content {
            display: none;
            margin-top: 12px;
            padding: 16px;
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
        }
        
        .example-content.open {
            display: block;
        }
        
        .example-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .example-tab {
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .example-tab:hover {
            border-color: var(--axos-orange);
            color: var(--text-primary);
        }
        
        .example-tab.active {
            background: var(--axos-orange);
            border-color: var(--axos-orange);
            color: var(--bg-primary);
        }
        
        .example-code {
            display: none;
        }
        
        .example-code.active {
            display: block;
        }
        
        .example-code pre {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-primary);
        }
        
        .example-code pre code {
            color: inherit;
        }
        
        /* Section Notes */
        .section-notes {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .section-notes label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--warning);
            margin-bottom: 10px;
        }
        
        .section-notes textarea {
            width: 100%;
            min-height: 80px;
            padding: 14px;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        
        .section-notes textarea:focus {
            outline: none;
            border-color: var(--warning);
        }
        
        /* Evaluation Section */
        .evaluation-section {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 2px solid var(--success);
            border-radius: 16px;
            padding: 30px;
            margin-top: 40px;
        }
        
        .evaluation-section h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--success);
        }
        
        .eval-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .eval-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        
        .eval-item label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--axos-orange);
            margin-bottom: 10px;
        }
        
        .eval-item textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        
        .eval-item textarea:focus {
            outline: none;
            border-color: var(--axos-orange);
        }
        
        /* Edit Question Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .modal-header h3 {
            font-size: 18px;
            color: var(--axos-orange);
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background: var(--error);
            color: white;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-body .form-group {
            margin-bottom: 20px;
        }
        
        .modal-body .form-group label {
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .modal-body textarea {
            width: 100%;
            min-height: 120px;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        
        .modal-body textarea:focus {
            outline: none;
            border-color: var(--axos-orange);
        }
        
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
        }
        
        .modal-btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .modal-btn.secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        
        .modal-btn.secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }
        
        .modal-btn.primary {
            background: linear-gradient(135deg, var(--axos-orange) 0%, var(--axos-orange-dark) 100%);
            border: none;
            color: var(--bg-primary);
        }
        
        .modal-btn.primary:hover {
            box-shadow: 0 4px 15px rgba(250, 167, 74, 0.3);
        }
        
        .modal-btn.danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--error);
            color: var(--error);
        }
        
        .modal-btn.danger:hover {
            background: var(--error);
            color: white;
        }
        
        /* Edit button on questions */
        .question-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        
        .edit-question-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            color: var(--info);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .edit-question-btn:hover {
            background: var(--info);
            color: white;
        }
        
        .delete-question-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            color: var(--error);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        
        .delete-question-btn:hover {
            background: var(--error);
            color: white;
        }
        
        /* Add Question Button */
        .add-question-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px dashed rgba(16, 185, 129, 0.4);
            border-radius: 12px;
            color: var(--success);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-top: 16px;
        }
        
        .add-question-btn:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--success);
        }
        
        /* Custom question indicator */
        .custom-badge {
            display: inline-flex;
            padding: 2px 8px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--success);
            margin-left: 8px;
            text-transform: uppercase;
        }
        
        /* Recommendation Options */
        .recommendation-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        
        .recommendation-option {
            position: relative;
        }
        
        .recommendation-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        
        .recommendation-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .recommendation-option input:checked + label {
            border-color: var(--axos-orange);
            background: rgba(250, 167, 74, 0.1);
            color: var(--axos-orange);
        }
        
        .recommendation-option.strong-hire input:checked + label {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }
        
        .recommendation-option.hire input:checked + label {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
        
        .recommendation-option.leaning-no input:checked + label {
            border-color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }
        
        .recommendation-option.no-hire input:checked + label {
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }
        
        /* AI Prompt Section */
        .ai-prompt-section {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(250, 167, 74, 0.1) 100%);
            border: 2px solid var(--axos-orange);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
        }
        
        .ai-prompt-section h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--axos-orange);
        }
        
        .ai-prompt-section p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .generate-prompt-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--axos-orange) 0%, var(--axos-orange-dark) 100%);
            border: none;
            border-radius: 12px;
            color: var(--bg-primary);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .generate-prompt-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(250, 167, 74, 0.4);
        }
        
        .prompt-output {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: none;
        }
        
        .prompt-output.visible {
            display: block;
        }
        
        .prompt-output pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            transition: all 0.2s ease;
        }
        
        .copy-btn:hover {
            border-color: var(--axos-orange);
            background: var(--bg-card);
        }
        
        /* Actions Bar */
        .actions-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
        }
        
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            border-color: var(--axos-orange);
            transform: translateY(-2px);
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, var(--axos-orange) 0%, var(--axos-orange-dark) 100%);
            border-color: transparent;
            color: var(--bg-primary);
        }
        
        .action-btn.primary:hover {
            box-shadow: 0 8px 25px rgba(250, 167, 74, 0.3);
        }
        
        /* Syntax Highlighting */
        .keyword { color: #c792ea; }
        .string { color: #c3e88d; }
        .comment { color: #546e7a; font-style: italic; }
        .function { color: #82aaff; }
        .number { color: #f78c6c; }
        .operator { color: #89ddff; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 20px 15px; }
            .tabs-header { gap: 8px; }
            .candidate-tab { padding: 10px 14px; font-size: 13px; }
            .section-header { padding: 16px 18px; }
            .section-content { padding: 18px; }
            .question-card { padding: 16px; }
            .evaluation-section, .ai-prompt-section { padding: 20px; }
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .candidate-form { animation: fadeIn 0.3s ease; }
        
        /* Back to Top Button */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--axos-orange) 0%, var(--axos-orange-dark) 100%);
            border: none;
            border-radius: 50%;
            color: var(--bg-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(250, 167, 74, 0.4);
            transition: all 0.3s ease;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
        }
        
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }
        
        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(250, 167, 74, 0.5);
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <!-- Edit/Add Question Modal -->
    <div class="modal-overlay" id="questionModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Edit Question</h3>
                <button class="modal-close" onclick="closeQuestionModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editQuestionId">
                <input type="hidden" id="editAnswerName">
                <input type="hidden" id="editSectionId">
                <input type="hidden" id="editMode">
                
                <div class="form-group">
                    <label>Question Type</label>
                    <select id="editQuestionType" style="padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-size: 14px; width: 100%;">
                        <option value="core">Core Question</option>
                        <option value="optional">Optional Deep-Dive</option>
                        <option value="exercise">Exercise</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Question Text</label>
                    <textarea id="editQuestionText" placeholder="Enter the question..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn secondary" onclick="closeQuestionModal()">Cancel</button>
                <button type="button" class="modal-btn primary" onclick="saveQuestion()">Save Question</button>
            </div>
        </div>
    </div>
    
    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>
    
    <div class="container">
        <header class="header">
            <div class="header-badge">📋 Interview Assessment Tool</div>
            <h1>Technical <span class="gradient-text">Interview</span></h1>
            <p>By Carlos Martinez | Axos Quality Center of Excellence</p>
        </header>
        
        <!-- Candidate Tabs -->
        <div class="candidates-container">
            <div class="tabs-header">
                <div id="candidateTabs"></div>
                <button class="add-candidate-btn" onclick="addCandidate()">
                    <span>+</span> Add Candidate
                </button>
            </div>
        </div>
        
        <!-- Main Content (per candidate) -->
        <div id="candidateFormsContainer"></div>
    </div>
    
    <script>
        let candidates = [];
        let activeCandidateId = null;
        
        // Initialize with one candidate
        document.addEventListener('DOMContentLoaded', () => {
            addCandidate();
        });
        
        function generateId() {
            return 'candidate_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function addCandidate() {
            const id = generateId();
            const candidateNum = candidates.length + 1;
            candidates.push({
                id,
                name: `Candidate ${candidateNum}`,
                data: {}
            });
            activeCandidateId = id;
            renderTabs();
            renderCandidateForm();
        }
        
        function removeCandidate(id) {
            if (candidates.length <= 1) {
                alert('You must have at least one candidate.');
                return;
            }
            if (confirm('Are you sure you want to remove this candidate?')) {
                candidates = candidates.filter(c => c.id !== id);
                if (activeCandidateId === id) {
                    activeCandidateId = candidates[0].id;
                }
                renderTabs();
                renderCandidateForm();
            }
        }
        
        function switchCandidate(id) {
            saveCurrentCandidateData();
            activeCandidateId = id;
            renderTabs();
            renderCandidateForm();
        }
        
        function saveCurrentCandidateData() {
            const candidate = candidates.find(c => c.id === activeCandidateId);
            if (!candidate) return;
            
            const form = document.getElementById('candidateForm_' + activeCandidateId);
            if (!form) return;
            
            const formData = new FormData(form);
            candidate.data = {};
            formData.forEach((value, key) => {
                candidate.data[key] = value;
            });
            
            // Save checkboxes
            form.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                candidate.data[cb.name] = cb.checked;
            });
            
            // Save radio buttons
            form.querySelectorAll('input[type="radio"]:checked').forEach(rb => {
                candidate.data[rb.name] = rb.value;
            });
        }
        
        function renderTabs() {
            const tabsContainer = document.getElementById('candidateTabs');
            tabsContainer.innerHTML = candidates.map(c => `
                <div class="candidate-tab ${c.id === activeCandidateId ? 'active' : ''}" onclick="switchCandidate('${c.id}')">
                    <span>👤 ${c.name || 'Unnamed'}</span>
                    <button class="remove-btn" onclick="event.stopPropagation(); removeCandidate('${c.id}')">×</button>
                </div>
            `).join('');
        }
        
        function updateCandidateName(id) {
            const candidate = candidates.find(c => c.id === id);
            if (!candidate) return;
            const input = document.querySelector(`input[name="candidateName"]`);
            if (input) {
                candidate.name = input.value || 'Unnamed';
                renderTabs();
            }
        }
        
        function renderCandidateForm() {
            const container = document.getElementById('candidateFormsContainer');
            const candidate = candidates.find(c => c.id === activeCandidateId);
            if (!candidate) return;
            
            container.innerHTML = getCandidateFormHTML(candidate);
            
            // Restore saved data
            if (candidate.data) {
                Object.keys(candidate.data).forEach(key => {
                    const el = document.querySelector(`[name="${key}"]`);
                    if (el) {
                        if (el.type === 'checkbox') {
                            el.checked = candidate.data[key];
                        } else if (el.type === 'radio') {
                            // For radio buttons, find the one with matching value
                            const radio = document.querySelector(`[name="${key}"][value="${candidate.data[key]}"]`);
                            if (radio) radio.checked = true;
                        } else {
                            el.value = candidate.data[key];
                        }
                    }
                });
            }
        }
        
        function getCandidateFormHTML(candidate) {
            return `
            <form id="candidateForm_${candidate.id}" class="candidate-form">
                <!-- Actions Bar -->
                <div class="actions-bar">
                    <button type="button" class="action-btn" onclick="saveToLocalStorage()">
                        💾 Save Progress
                    </button>
                    <button type="button" class="action-btn" onclick="exportToJSON()">
                        📤 Export JSON
                    </button>
                    <button type="button" class="action-btn primary" onclick="document.getElementById('importFile').click()">
                        📥 Import JSON
                    </button>
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importFromJSON(event)">
                </div>
                
                <!-- Candidate Info -->
                <div class="candidate-info">
                    <div class="info-grid">
                        <div class="form-group">
                            <label>Candidate Name</label>
                            <input type="text" name="candidateName" placeholder="Enter candidate name" 
                                   value="${candidate.name}" onchange="updateCandidateName('${candidate.id}')">
                        </div>
                        <div class="form-group">
                            <label>Role / Position</label>
                            <input type="text" name="role" placeholder="e.g., Senior SDET">
                        </div>
                        <div class="form-group">
                            <label>Seniority Level</label>
                            <select name="seniority">
                                <option value="">Select level...</option>
                                <option value="junior">Junior</option>
                                <option value="intermediate">Intermediate</option>
                                <option value="senior">Senior</option>
                                <option value="lead">Lead</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Team / Department</label>
                            <input type="text" name="team" placeholder="e.g., QCoE">
                        </div>
                        <div class="form-group">
                            <label>Interviewer</label>
                            <input type="text" name="interviewer" placeholder="Your name" value="Carlos Martinez">
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" name="interviewDate" value="${new Date().toISOString().split('T')[0]}">
                        </div>
                    </div>
                </div>
                
                <!-- Section Navigation -->
                <nav class="section-nav">
                    <button type="button" class="section-nav-btn active" onclick="scrollToSection('section0')">Intro</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section1')">Web</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section2')">Mobile</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section3')">API</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section4')">CI/CD</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section5')">AI & Low-Code</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section6')">SQL</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section7')">Performance</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('section8')">Exercises</button>
                    <button type="button" class="section-nav-btn" onclick="scrollToSection('evaluation')">Evaluation</button>
                </nav>
                
                <!-- Section 0: Intro -->
                <div class="section" id="section0">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">👋</div>
                            <div>
                                <h2>Section 0: Intro – Background & Communication</h2>
                                <p>Understand candidate's background and communication style</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q0_1', 'Core Question', 'Tell me about your experience with automated testing and the frameworks you\'ve used.', 's0q1')}
                        ${renderQuestion('q0_2', 'Core Question', 'What\'s the most challenging automation problem you\'ve solved?', 's0q2')}
                        ${renderAddQuestionButton('section0')}
                        ${renderSectionNotes('section0Notes')}
                    </div>
                </div>
                
                <!-- Section 1: Web Automation -->
                <div class="section" id="section1">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">🌐</div>
                            <div>
                                <h2>Section 1: Web Automation</h2>
                                <p>Assess depth in web UI automation and framework design</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q1_1', 'Core Question', 'How would you design a Selenium-based framework for a large-scale web app? Include which design patterns (e.g., Page Object Model) you would use and why.', 's1q1')}
                        ${renderQuestion('q1_2', 'Core Question', 'How do you handle dynamic elements or flaky tests?', 's1q2')}
                        ${renderQuestion('q1_3', 'Core Question', 'Explain the difference between implicit and explicit waits in Selenium.', 's1q3')}
                        ${renderQuestion('q1_4', 'Core Question', 'What is the role of a test runner (e.g., JUnit, TestNG)?', 's1q4')}
                        ${renderQuestion('q1_5', 'Optional Deep-Dive', 'How do you implement cross-browser testing efficiently?', 's1q5', true)}
                        ${renderQuestion('q1_6', 'Optional Deep-Dive', 'How do you manage test data for UI tests?', 's1q6', true)}
                        ${renderAddQuestionButton('section1')}
                        ${renderSectionNotes('section1Notes')}
                    </div>
                </div>
                
                <!-- Section 2: Mobile Automation -->
                <div class="section" id="section2">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">📱</div>
                            <div>
                                <h2>Section 2: Mobile Automation</h2>
                                <p>Evaluate experience with mobile test automation</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q2_1', 'Core Question', 'How does Appium work for mobile automation? How do you manage different OS versions and devices?', 's2q1')}
                        ${renderQuestion('q2_2', 'Core Question', 'What are Desired Capabilities in Appium?', 's2q2')}
                        ${renderQuestion('q2_3', 'Core Question', 'How do you handle gestures or hybrid apps?', 's2q3')}
                        ${renderQuestion('q2_4', 'Optional Deep-Dive', 'How do you ensure test stability across different screen resolutions and hardware configurations?', 's2q4', true)}
                        ${renderQuestion('q2_5', 'Optional Deep-Dive', 'How do you manage test data and environment setup for mobile tests?', 's2q5', true)}
                        ${renderAddQuestionButton('section2')}
                        ${renderSectionNotes('section2Notes')}
                    </div>
                </div>
                
                <!-- Section 3: API Testing -->
                <div class="section" id="section3">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">🔌</div>
                            <div>
                                <h2>Section 3: API Testing</h2>
                                <p>Understand API testing strategy and tooling</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q3_1', 'Core Question', 'How do you validate REST API responses beyond status codes?', 's3q1')}
                        ${renderQuestion('q3_2', 'Core Question', 'What tools do you prefer for API testing (e.g., Postman, RestAssured) and why?', 's3q2')}
                        ${renderQuestion('q3_3', 'Core Question', 'How would you integrate API tests into a CI/CD pipeline?', 's3q3')}
                        ${renderQuestion('q3_4', 'Optional Deep-Dive', 'How do you handle authentication in API tests (e.g., OAuth, JWT)?', 's3q4', true)}
                        ${renderQuestion('q3_5', 'Optional Deep-Dive', 'How do you mock APIs for testing?', 's3q5', true)}
                        ${renderAddQuestionButton('section3')}
                        ${renderSectionNotes('section3Notes')}
                    </div>
                </div>
                
                <!-- Section 4: CI/CD -->
                <div class="section" id="section4">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">⚙️</div>
                            <div>
                                <h2>Section 4: CI/CD & DevOps</h2>
                                <p>Assess how automation fits into delivery pipelines</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q4_1', 'Core Question', 'Describe how you set up automated tests in a CI/CD pipeline (e.g., Jenkins, Azure DevOps).', 's4q1')}
                        ${renderQuestion('q4_2', 'Core Question', 'How do you ensure fast feedback in pipelines?', 's4q2')}
                        ${renderQuestion('q4_3', 'Core Question', 'How do you manage test environments and test data in CI/CD?', 's4q3')}
                        ${renderQuestion('q4_4', 'Optional Deep-Dive', 'What strategies do you use for parallel execution of tests?', 's4q4', true)}
                        ${renderQuestion('q4_5', 'Optional Deep-Dive', 'How do you integrate mobile, web, API, and performance tests into CI/CD pipelines?', 's4q5', true)}
                        ${renderAddQuestionButton('section4')}
                        ${renderSectionNotes('section4Notes')}
                    </div>
                </div>
                
                <!-- Section 5: AI & Low-Code -->
                <div class="section" id="section5">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">🤖</div>
                            <div>
                                <h2>Section 5: AI & Low-Code/No-Code</h2>
                                <p>Gauge familiarity with modern automation trends</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q5_1', 'Core Question', 'How can AI tools (e.g., self-healing locators) improve automation?', 's5q1')}
                        ${renderQuestion('q5_2', 'Core Question', 'What\'s your view on low-code/no-code platforms? When would you recommend them?', 's5q2')}
                        ${renderQuestion('q5_3', 'Optional Deep-Dive', 'Have you used predictive analytics for test coverage? If so, how?', 's5q3', true)}
                        ${renderAddQuestionButton('section5')}
                        ${renderSectionNotes('section5Notes')}
                    </div>
                </div>
                
                <!-- Section 6: SQL -->
                <div class="section" id="section6">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">🗃️</div>
                            <div>
                                <h2>Section 6: SQL</h2>
                                <p>Validate SQL knowledge and database concepts</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q6_1', 'Core Question', 'What is the difference between INNER JOIN, LEFT JOIN, and RIGHT JOIN? When would you use each?', 's6q1')}
                        ${renderQuestion('q6_2', 'Core Question', 'Explain the difference between WHERE and HAVING clauses.', 's6q2')}
                        ${renderQuestion('q6_3', 'Core Question', 'What are indexes and how do they improve query performance? Any downsides?', 's6q3')}
                        ${renderQuestion('q6_4', 'Core Question', 'How would you find duplicate records in a table?', 's6q4')}
                        ${renderAddQuestionButton('section6')}
                        ${renderSectionNotes('section6Notes')}
                    </div>
                </div>
                
                <!-- Section 7: Performance Testing -->
                <div class="section" id="section7">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">📊</div>
                            <div>
                                <h2>Section 7: Performance Testing</h2>
                                <p>Understand exposure to performance and load testing</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        ${renderQuestion('q7_1', 'Core Question', 'What tools have you used for performance testing (e.g., JMeter)?', 's7q1')}
                        ${renderQuestion('q7_2', 'Core Question', 'How do you interpret performance metrics?', 's7q2')}
                        ${renderAddQuestionButton('section7')}
                        ${renderSectionNotes('section7Notes')}
                    </div>
                </div>
                
                <!-- Section 8: Exercises -->
                <div class="section" id="section8">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <div class="section-icon">💻</div>
                            <div>
                                <h2>Section 8: Coding Exercises</h2>
                                <p>Assess hands-on coding and problem solving. Pick 1–2 based on seniority.</p>
                            </div>
                        </div>
                        <div class="section-toggle">▼</div>
                    </div>
                    <div class="section-content">
                        <h3 style="color: var(--axos-orange); margin-bottom: 20px; font-size: 16px;">📝 Exercise 1: API CRUD Task (8–10 min)</h3>

        // Example Data
        function getSQLExamples(type) {
            const examples = {
                'sql_no_orders': `-- Find all users who have not placed any orders
-- Method 1: Using LEFT JOIN with NULL check
SELECT u.id, u.name, u.email
FROM Users u
LEFT JOIN Orders o ON u.id = o.user_id
WHERE o.id IS NULL;

-- Method 2: Using NOT EXISTS (often more efficient)
SELECT u.id, u.name, u.email
FROM Users u
WHERE NOT EXISTS (
    SELECT 1 FROM Orders o WHERE o.user_id = u.id
);

-- Method 3: Using NOT IN
SELECT id, name, email
FROM Users
WHERE id NOT IN (SELECT DISTINCT user_id FROM Orders);`,

                'sql_total_amount': `-- Calculate total order amount per user
SELECT 
    u.name,
    COALESCE(SUM(o.amount), 0) AS total_amount
FROM Users u
LEFT JOIN Orders o ON u.id = o.user_id
GROUP BY u.id, u.name
ORDER BY total_amount DESC;

-- Alternative: Only users with orders
SELECT 
    u.name,
    SUM(o.amount) AS total_amount
FROM Users u
INNER JOIN Orders o ON u.id = o.user_id
GROUP BY u.id, u.name
ORDER BY total_amount DESC;`,

                'sql_update_shipped': `-- Update all orders for a specific user to SHIPPED
UPDATE Orders
SET status = 'SHIPPED'
WHERE user_id = 5;

-- With safety check (best practice)
UPDATE Orders
SET status = 'SHIPPED'
WHERE user_id = 5
  AND status != 'SHIPPED';  -- Only update if not already shipped`,

                'sql_avg_by_status': `-- Average order amount per status
SELECT 
    status,
    AVG(amount) AS avg_amount,
    COUNT(*) AS order_count
FROM Orders
GROUP BY status
ORDER BY avg_amount DESC;

-- Result would show:
-- Completed: (50.75 + 0.50 + 0.00) / 3 = 17.08
-- Shipped: (50.00 + 20.00) / 2 = 35.00
-- Pending: 9.99
-- Cancelled: 5.25`,

                'sql_multiple_orders': `-- Users with more than one order
SELECT 
    u.id,
    u.name,
    COUNT(o.id) AS order_count
FROM Users u
INNER JOIN Orders o ON u.id = o.user_id

                if (d.ex2q2) { prompt += `**Isogram Check:**\n${d.ex2q2}\n\n`; hasExercises = true; }
                if (d.ex2q3) { prompt += `**Vowel Counter:**\n${d.ex2q3}\n\n`; hasExercises = true; }
                if (d.ex2Notes) { prompt += `**Coding Exercise Notes:**\n${d.ex2Notes}\n\n`; }
            }
            
            if (d.ex3q1) {
                prompt += `### Web Automation Exercise\n`;
                prompt += `**Amazon Navigation Locators:**\n${d.ex3q1}\n\n`;
                hasExercises = true;
                if (d.ex3Notes) { prompt += `**Web Exercise Notes:**\n${d.ex3Notes}\n\n`; }
            }
            
            if (d.ex4q1 || d.ex4q2 || d.ex4q3 || d.ex4q4 || d.ex4q5) {
                prompt += `### SQL Exercises\n`;
                if (d.ex4q1) { prompt += `**Users With No Orders:**\n${d.ex4q1}\n\n`; hasExercises = true; }
                if (d.ex4q2) { prompt += `**Total Amount Per User:**\n${d.ex4q2}\n\n`; hasExercises = true; }
                if (d.ex4q3) { prompt += `**Users With Multiple Orders:**\n${d.ex4q3}\n\n`; hasExercises = true; }
                if (d.ex4q4) { prompt += `**Avg Amount Per Status:**\n${d.ex4q4}\n\n`; hasExercises = true; }
                if (d.ex4q5) { prompt += `**User With Highest Total:**\n${d.ex4q5}\n\n`; hasExercises = true; }
                if (d.ex4Notes) { prompt += `**SQL Exercise Notes:**\n${d.ex4Notes}\n\n`; }
            }
            
            if (!hasExercises) {
                prompt += `*[No coding exercises were administered]*\n`;
            }
            
            if (d.section8Notes) prompt += `**Exercise Notes:** ${d.section8Notes}\n\n`;
            
            // Add custom questions
            const customQs = candidate.customQuestions || {};
            const customKeys = Object.keys(customQs);
            if (customKeys.length > 0) {
                prompt += `\n---\n\n## CUSTOM QUESTIONS\n`;
                customKeys.forEach(key => {
                    const q = customQs[key];
                    const answerKey = q.answerName || `custom_ans_${key}`;
                    if (d[answerKey]) {
                        prompt += `**${q.text}:**\n${d[answerKey]}\n\n`;
                    }
                });
            }
            
            prompt += `\n---\n\nKeep it SHORT. No tables, no lengthy explanations. Just the 5 sections with brief answers.`;
            
            document.getElementById('promptText').textContent = prompt;
            document.getElementById('promptOutput').classList.add('visible');
        }
        
        function copyPrompt() {
            const text = document.getElementById('promptText').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('#promptOutput .copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            });
        }

        function saveToLocalStorage() {
            saveCurrentCandidateData();
            localStorage.setItem('interviewData', JSON.stringify(candidates));
            alert('Progress saved to browser storage!');
        }
        
        function exportToJSON() {
            saveCurrentCandidateData();
            const dataStr = JSON.stringify(candidates, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `interview-data-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function importFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported) && imported.length > 0) {
                        if (confirm(`Found ${imported.length} candidate(s) in the file. This will replace your current data. Continue?`)) {
                            candidates = imported;
                            activeCandidateId = candidates[0].id;
                            renderTabs();
                            renderCandidateForm();
                            localStorage.setItem('interviewData', JSON.stringify(candidates));
                            alert('Import successful!');
                        }
                    } else {
                        alert('Invalid file format. Expected an array of candidates.');
                    }
                } catch (err) {
                    alert('Failed to parse JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
            
            // Reset input so the same file can be imported again
            event.target.value = '';
        }
        
        // Load saved data on page load
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('interviewData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.length > 0) {
                        if (confirm('Found saved interview data. Would you like to restore it?')) {
                            candidates = parsed;
                            activeCandidateId = candidates[0].id;
                            renderTabs();
                            renderCandidateForm();
                        }
                    }
                } catch (e) {
                    console.error('Failed to parse saved data:', e);
                }
            }
        });
        
        // Auto-save periodically
        setInterval(() => {
            saveCurrentCandidateData();
            localStorage.setItem('interviewData', JSON.stringify(candidates));
        }, 30000); // Every 30 seconds
        
        // Back to Top functionality
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        window.addEventListener('scroll', () => {
            const backToTop = document.getElementById('backToTop');
            if (window.scrollY > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
        
        // ========== QUESTION EDITING FUNCTIONS ==========
        
        // Store for custom questions per candidate
        function getCustomQuestions() {
            const candidate = candidates.find(c => c.id === activeCandidateId);
            if (!candidate.customQuestions) candidate.customQuestions = {};
            return candidate.customQuestions;
        }
        
        function openEditQuestionModal(questionId, answerName) {
            const card = document.querySelector(`[data-question-id="${questionId}"]`);
            const questionText = card.querySelector('.question-text-content').textContent;
            const labelEl = card.querySelector('.question-label');
            let type = 'core';
            if (labelEl.classList.contains('optional')) type = 'optional';
            if (labelEl.textContent.includes('Exercise')) type = 'exercise';
            
            document.getElementById('modalTitle').textContent = 'Edit Question';
            document.getElementById('editQuestionId').value = questionId;
            document.getElementById('editAnswerName').value = answerName;
            document.getElementById('editMode').value = 'edit';
            document.getElementById('editQuestionType').value = type;
            document.getElementById('editQuestionText').value = questionText;
            
            document.getElementById('questionModal').classList.add('active');
        }
        
        function openAddQuestionModal(sectionId) {
            document.getElementById('modalTitle').textContent = 'Add Custom Question';
            document.getElementById('editQuestionId').value = '';
            document.getElementById('editSectionId').value = sectionId;
            document.getElementById('editMode').value = 'add';
            document.getElementById('editQuestionType').value = 'core';
            document.getElementById('editQuestionText').value = '';
            
            document.getElementById('questionModal').classList.add('active');
        }
        
        function closeQuestionModal() {
            document.getElementById('questionModal').classList.remove('active');
        }
        
        function saveQuestion() {
            const mode = document.getElementById('editMode').value;
            const questionText = document.getElementById('editQuestionText').value.trim();
            const questionType = document.getElementById('editQuestionType').value;
            
            if (!questionText) {
                alert('Please enter a question.');
                return;
            }
            
            if (mode === 'edit') {
                const questionId = document.getElementById('editQuestionId').value;
                const card = document.querySelector(`[data-question-id="${questionId}"]`);
                if (card) {
                    card.querySelector('.question-text-content').textContent = questionText;
                    const labelEl = card.querySelector('.question-label');
                    const typeLabels = { core: 'Core Question', optional: 'Optional Deep-Dive', exercise: 'Exercise' };
                    const isCustom = labelEl.innerHTML.includes('Custom');
                    labelEl.className = 'question-label' + (questionType === 'optional' ? ' optional' : '');
                    labelEl.innerHTML = typeLabels[questionType] + (isCustom ? '<span class="custom-badge">Custom</span>' : '');
                    
                    // Store in custom questions if modified
                    const customQs = getCustomQuestions();
                    customQs[questionId] = { text: questionText, type: questionType, modified: true };
                }
            } else if (mode === 'add') {
                const sectionId = document.getElementById('editSectionId').value;
                const newId = 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                const answerName = 'custom_ans_' + newId;
                
                const typeLabels = { core: 'Core Question', optional: 'Optional Deep-Dive', exercise: 'Exercise' };
                const isOptional = questionType === 'optional';
                
                const newQuestionHTML = `
                <div class="question-card" data-question-id="${newId}">
                    <div class="question-header">
                        <input type="checkbox" class="question-checkbox" name="${newId}_asked" id="${newId}_asked">
                        <div class="question-text">
                            <div class="question-label ${isOptional ? 'optional' : ''}">${typeLabels[questionType]}<span class="custom-badge">Custom</span></div>
                            <p class="question-text-content">${questionText}</p>
                        </div>
                        <div class="question-actions">
                            <button type="button" class="edit-question-btn" onclick="openEditQuestionModal('${newId}', '${answerName}')" title="Edit Question">✏️</button>
                            <button type="button" class="delete-question-btn" onclick="deleteQuestion('${newId}')" title="Delete Question">🗑️</button>
                        </div>
                    </div>
                    <div class="answer-area">
                        <textarea name="${answerName}" placeholder="Record candidate's answer here..."></textarea>
                    </div>
                </div>
                `;
                
                const sectionContent = document.querySelector(`#${sectionId} .section-content`);
                const addBtn = sectionContent.querySelector('.add-question-btn');
                if (addBtn) {
                    addBtn.insertAdjacentHTML('beforebegin', newQuestionHTML);
                } else {
                    const notesSection = sectionContent.querySelector('.section-notes');
                    if (notesSection) {
                        notesSection.insertAdjacentHTML('beforebegin', newQuestionHTML);
                    }
                }
                
                // Store in custom questions
                const customQs = getCustomQuestions();
                customQs[newId] = { text: questionText, type: questionType, answerName: answerName, sectionId: sectionId };
            }
            
            closeQuestionModal();
        }
        
        function deleteQuestion(questionId) {
            if (confirm('Are you sure you want to delete this custom question?')) {
                const card = document.querySelector(`[data-question-id="${questionId}"]`);
                if (card) {
                    card.remove();
                }
                // Remove from custom questions
                const customQs = getCustomQuestions();
                delete customQs[questionId];
            }
        }
    </script>
